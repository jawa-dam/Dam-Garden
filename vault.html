<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEI A'Dam Vault</title><style>
*{box-sizing:border-box}body{margin:0;background:#08121c;color:#eef6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{width:min(960px,100%);margin:auto;padding:16px}.card{background:#0c1c2a;border:1px solid #294762;border-radius:22px;padding:20px;margin:12px 0}.eyebrow{font-size:.72rem;letter-spacing:.14em;color:#6be7ff;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;background:#11647d;color:#fff;cursor:pointer}.pink{background:#ff4081}.status{padding:12px;border-radius:13px;border:1px solid #5a3547;background:#211823}.ok{border-color:#2e8e70;background:#102a22}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:16px;background:#000}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<section class="card"><div class="eyebrow">MASTER BUILDER REWARDS</div><h1>A'Dam Vault</h1><p id="intro">Checking Academy progress…</p><a class="btn" href="index.html">🏠 Academy Home</a></section>
<div class="grid"><section class="card"><div class="eyebrow">🎓 CERTIFICATE</div><h2>Official Certificate</h2><p id="certStatus">Locked.</p><button id="cert" class="btn pink">View Certificate</button></section>
<section class="card"><div class="eyebrow">🎬 VIDEO VAULT</div><h2>A'Dam Video Vault</h2><p id="videoStatus">Locked.</p><button id="video" class="btn pink">Open Exclusive Video</button></section></div>
<section class="card"><div class="eyebrow">LIVE PREVIEW</div><div id="state" class="status">LOCKED</div></section></div>
<script src="js/gei-vault-economy-engine.js"></script><script>
(function(){
function st(){try{return JSON.parse(localStorage.getItem('gei-academy-state-v1')||'{}')||{}}catch(e){return {}}}
function modal(h){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:14px;z-index:9';o.innerHTML='<div style="max-width:900px;width:100%;background:#0d1d2c;border:1px solid #35556f;border-radius:20px;padding:18px"><button id="x" style="float:right">✕</button>'+h+'</div>';document.body.appendChild(o);o.querySelector('#x').onclick=function(){o.remove()}}
function render(){var s=st(),c=(s.completed||[]).length>=6,n=s.name||'Explorer',x=Number(s.xp||0);document.getElementById('intro').textContent=c?'🏆 '+n+' — Vault unlocked · '+x+' XP':'🔒 Complete Levels 1–6 · '+(s.completed||[]).length+'/6';document.getElementById('certStatus').textContent=c?'Unlocked — view/print.':'Locked until Level 6.';document.getElementById('videoStatus').textContent=c?'Unlocked — exclusive video.':'Locked until Level 6.';var b=document.getElementById('state');b.className='status '+(c?'ok':'');b.textContent=c?'🟢 UNLOCKED · MASTER BUILDER':'🔒 LOCKED';document.getElementById('cert').disabled=!c;document.getElementById('video').disabled=!c}
document.getElementById('cert').onclick=function(){if(!GEI_VAULT_ECONOMY.unlocked())return;var s=st(),n=s.name||'Explorer';modal('<div style="text-align:center;border:2px solid #ffd166;border-radius:16px;padding:24px"><div style="font-size:2.8rem">🏆</div><div class="eyebrow" style="color:#ffd166">YALL TOO · GEI ACADEMY</div><h2>Certificate of Completion</h2><p>This certifies that</p><h1>'+n+'</h1><p>has completed the <b>Six-Day GEI Foundation Academy</b>.</p><p>'+Number(s.xp||0)+' XP · MASTER BUILDER</p><button class="btn pink" onclick="print()">⬇️ Save Certificate</button></div>')};
document.getElementById('video').onclick=function(){if(!GEI_VAULT_ECONOMY.unlocked())return;modal('<h2>A\'Dam Video Vault</h2><iframe class="video" src="https://www.youtube.com/embed/FetuY7WFS3M?playsinline=1" title="A\'Dam Video Vault" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>')};
render();addEventListener('storage',render);addEventListener('pageshow',render)
})();
</script></body></html>
